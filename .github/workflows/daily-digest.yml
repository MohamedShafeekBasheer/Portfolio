# Every morning (06:17 UTC+3): collect Microsoft 365 / PnP news into a "Daily digest" issue,
# and — if the ANTHROPIC_API_KEY secret is set — open a pull request with one drafted note
# plus LinkedIn text. Nothing is published until you merge the pull request.
name: Daily digest

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/digest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
