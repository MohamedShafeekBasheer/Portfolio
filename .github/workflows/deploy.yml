# Builds the site and publishes it to GitHub Pages on every push to main
# (including when you merge a draft-note pull request), and every morning so
# that notes dated today go live on their date.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "13 5 * * *"   # 08:13 Riyadh, before the 9:00 LinkedIn post
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the sitemap's lastmod dates are real
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          # "/Portfolio/" for this repo; "/" if the repo is renamed to <user>.github.io or a custom domain is added.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (used by ChatGPT search and Copilot) and Yandex about every page, via IndexNow.
  # A failure here never affects the published site.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request
          site = json.load(open("src/content/site.json"))
          key = site["indexnow_key"]
          base = "https://mohamedshafeekbasheer.github.io/Portfolio"
          time.sleep(30)  # give GitHub Pages a moment to serve the new deploy
          sitemap = urllib.request.urlopen(f"{base}/sitemap.xml", timeout=30).read().decode()
          entries = re.findall(r"<loc>([^<]+)</loc><lastmod>([^<]+)</lastmod>", sitemap)
          urls = [u for u, _ in entries]
          if "${{ github.event_name }}" == "schedule":
              # Daily run: only send what changed today (a new note and the pages that list it).
              today = time.strftime("%Y-%m-%d", time.gmtime(time.time() + 3 * 3600))
              urls = [u for u, d in entries if d == today]
              if not urls:
                  print("IndexNow: nothing new today"); raise SystemExit
          body = json.dumps({"host": "mohamedshafeekbasheer.github.io", "key": key,
                             "keyLocation": f"{base}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow:", r.status, "for", len(urls), "URLs")
          PY
